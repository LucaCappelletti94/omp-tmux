[package]
name = "omp-dock"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[dependencies]
crossterm = { version = "0.28.1", default-features = false, features = ["events"] }
ratatui = { version = "0.29.0", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
