set -g status-style 'bg=colour235,fg=colour250'

# Layout, key and style settings, left alone when set before this file is sourced.
set -goq @omp_max_rows 5
set -goq @omp_label_width 20
set -goq @omp_key A
set -goq @omp_style_waiting 'fg=black bg=yellow'
set -goq @omp_style_bell 'fg=black bg=green'
set -goq @omp_style_priority 'fg=white bg=colour129'
set -goq @omp_style_working 'fg=colour250'
set -goq @omp_style_muted 'fg=colour244'
set -goq @omp_style_current 'bold underscore'

# OMP writes its state into the pane title over OSC 0: "π <sep> <label>".
# Separator: ">" idle, "!" needs input, braille spinner working.
set -g @omp_cell_omp '#{&&:#{m/r:^π . ,#{pane_title}},#{!=:#{s/^π . //:pane_title},}}'
# Hashes are escaped so a title is drawn as literal text, never as a style.
set -g @omp_cell_text '#{?#{E:@omp_cell_omp},#{s/^π . //;q/h:pane_title},#{q/h:window_name}}'
set -g @omp_cell_raw '#{?#{E:@omp_cell_omp},#{s/^π . //;s/[#]/x/:pane_title},#{s/[#]/x/:window_name}}'
set -g @omp_cell_width '#{w:#{E:@omp_cell_raw}}'
set -g @omp_cell_open '#{?window_active,#[#{@omp_style_current}],}'
# Each slot clears every colour and attribute it set, then restores the current-cell style.
set -g @omp_cell_reset '#[fg=default bg=default none]#{E:@omp_cell_open}'
# Slots: "?" any pane needs input, live spinner working, "·" idle, then "^" priority and "+" unseen bell.
set -g @omp_cell_state '#{?#{E:@omp_is_waiting},#[#{@omp_style_waiting}]?#{E:@omp_cell_reset},#{?#{m/r:^π [⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏] ,#{pane_title}},#[#{@omp_style_working}]#{=1:#{s/^π //:pane_title}}#{E:@omp_cell_reset},#{?#{m/r:^π . ,#{pane_title}},#[#{@omp_style_muted}]·#{E:@omp_cell_reset}, }}}'
set -g @omp_cell_flags '#{?#{E:@omp_is_priority},#[#{@omp_style_priority}]^#{E:@omp_cell_reset}, }#{?window_bell_flag,#[#{@omp_style_bell}]+#{E:@omp_cell_reset}, }'
set -g window-status-format '#{E:@omp_cell_open}#{E:@omp_cell_state}#{E:@omp_cell_flags}#{window_index}:#{?#{e|>:#{E:@omp_cell_width},#{@omp_label_width}},#{?#{e|>:#{@omp_label_width},1},#{=/#{e|-:#{@omp_label_width},1}/…:#{E:@omp_cell_text}},…},#{E:@omp_cell_text}}#[none]'
set -g window-status-current-format '#{E:window-status-format}'

# What each attention count and picker matches. A window waits when any of its panes does.
set -g @omp_is_waiting '#{!=:#{P:#{?#{m:π ! *,#{pane_title}},x,}},}'
set -g @omp_is_priority '#{==:#{@omp_priority},high}'

# Whole-session counts, padded to the window count's digits so changes never shift the bar.
set -g @omp_n_waiting '#{n:#{W:#{?#{E:@omp_is_waiting},x,}}}'
set -g @omp_n_bells '#{n:#{W:#{?window_bell_flag,x,}}}'
set -g @omp_n_priority '#{n:#{W:#{?#{E:@omp_is_priority},x,}}}'
set -g @omp_sum_waiting ' #{?#{e|>:#{E:@omp_n_waiting},0},#[#{@omp_style_waiting}],#[#{@omp_style_muted}]}?#{E:@omp_n_waiting}#[fg=default bg=default none]#{p/#{e|-:#{n:#{session_windows}},#{n:#{E:@omp_n_waiting}}}/:}'
set -g @omp_sum_bells ' #{?#{e|>:#{E:@omp_n_bells},0},#[#{@omp_style_bell}],#[#{@omp_style_muted}]}+#{E:@omp_n_bells}#[fg=default bg=default none]#{p/#{e|-:#{n:#{session_windows}},#{n:#{E:@omp_n_bells}}}/:}'
set -g @omp_sum_priority ' #{?#{e|>:#{E:@omp_n_priority},0},#[#{@omp_style_priority}],#[#{@omp_style_muted}]}^#{E:@omp_n_priority}#[fg=default bg=default none]#{p/#{e|-:#{n:#{session_windows}},#{n:#{E:@omp_n_priority}}}/:}'
set -g @omp_sum_total ' #{p/#{n:#{session_windows}}/:#{session_windows}} windows'
set -g @omp_sum_hints ' #{q/h:@omp_key} w/d/p'
set -g @omp_sum_session ' [#{?#{e|>:#{w:#{s/[#]/x/:session_name}},12},#{=/11/…:#{q/h:session_name}},#{q/h:session_name}}]'
set -g @omp_sum_zoom ' #{?window_zoomed_flag,Z, }'

# One row with tmux's own overflow markers, shown while no current layout fits the client.
# The list draws nothing unless its opening style carries an alignment. The job refreshes
# the layout while this row shows, and tmux skips it whenever the grid is current. tmux
# reruns a job at most once a second, so the window indices ride in a shell comment to make
# each new set of indices a new job that runs at once.
set -g @omp_native_row '#[list=on align=left]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#{E:window-status-format} ,#[list=focus]#{E:window-status-format}#[list=on] }#[nolist align=right]#{E:@omp_sum_waiting}#{E:@omp_sum_bells}#{E:@omp_sum_priority}#(#{E:@omp_refresh} # #{W:#{window_index}.})'
set -g status on
set -g status-format[0] '#{E:@omp_native_row}'

# tmux 3.4 to 3.6 draw the prompt cursor on row 0 whatever message-line says, so the
# helper moves messages to the summary row only from 3.6a, the first release that follows it.
set -gF @omp_message_line '#{m/r:^(3[.]6[a-z]|3[.]([7-9]|[1-9][0-9])|[4-9]|[1-9][0-9]|next|openbsd),#{version}}'

# OMP rings the terminal bell on turn completion and ask prompts. Flag the window, show a
# brief message and pass the bell on to the terminal, ignoring the active window.
set -g monitor-bell on
set -g visual-bell both
set -g bell-action other

# Mirror the active pane's OMP title on the outer terminal titlebar.
set -g set-titles on
set -g set-titles-string '#{pane_title}'

set -gF @omp_tmux_dir '#{d:current_file}'
set -g @omp_layout '#{q:@omp_tmux_dir}/scripts/omp-layout.sh'
# Every run of the helper drops its output and exit status, because run-shell would otherwise
# show them in view mode over the active pane. The helper shows its own failures as messages.
set -g @omp_refresh '#{E:@omp_layout} refresh #{q:socket_path} #{q:session_id} >/dev/null 2>&1 || true'

# Picker rows repeat a cell's signals with the full label, and session rows their counts.
set -g @omp_pick_row '#{?pane_format,#{q/h:pane_title},#{?window_format,#{E:@omp_cell_state}#{E:@omp_cell_flags} #{E:@omp_cell_text},#{s/^ //:#{E:@omp_sum_waiting}}#{E:@omp_sum_bells}#{E:@omp_sum_priority}}}'

# The agent menu. tmux expands formats in menu commands once when the menu opens, so the
# choose-tree formats are written with ## to reach choose-tree intact. choose-tree ignores a
# filter that matches nothing, so an empty picker becomes a message. Showing the bar sets
# @omp_bar so a global status off cannot hide it again.
set -g @omp_menu {
	display-menu -T '#[align=centre]omp-tmux agents' \
		'Waiting windows' w {
			if-shell -F '#{!=:#{S:#{W:#{?#{E:@omp_is_waiting},x,}}},}' {
				choose-tree -w -O index -f '##{E:@omp_is_waiting}' -F '##{E:@omp_pick_row}'
			} {
				display-message 'omp-tmux: no window is waiting for input'
			}
		} \
		'Unseen bells' d {
			if-shell -F '#{!=:#{S:#{W:#{?window_bell_flag,x,}}},}' {
				choose-tree -w -O index -f '##{window_bell_flag}' -F '##{E:@omp_pick_row}'
			} {
				display-message 'omp-tmux: no window has an unseen bell'
			}
		} \
		'Priority windows' p {
			if-shell -F '#{!=:#{S:#{W:#{?#{E:@omp_is_priority},x,}}},}' {
				choose-tree -w -O index -f '##{E:@omp_is_priority}' -F '##{E:@omp_pick_row}'
			} {
				display-message 'omp-tmux: no window is marked priority'
			}
		} \
		'' \
		'Mark priority' h { set-option -w @omp_priority high } \
		'Clear priority' c { set-option -wqu @omp_priority } \
		'' \
		'#{?#{==:#{status},off},Show,Hide} the bar' s {
			if-shell -F '#{==:#{status},off}' {
				set-option status on
				set-option @omp_bar shown
				run-shell -b '##{E:@omp_refresh}'
			} {
				set-option status off
				set-option -qu @omp_bar
			}
		} \
		'Lay out the bar again' r {
			run-shell -b '##{E:@omp_refresh}'
		}
}

# A key cannot come from an option in bind-key itself, so run-shell -C expands @omp_key
# first. A reload with another key frees the one bound last time.
if-shell -F '#{&&:#{@omp_key_bound},#{!=:#{@omp_key_bound},#{@omp_key}}}' {
	run-shell -C 'unbind-key #{q:@omp_key_bound}'
}
run-shell -C 'bind-key -N "omp-tmux agents" #{q:@omp_key} run-shell -C "##{@omp_menu}"'
set -gF @omp_key_bound '#{@omp_key}'

# Lay the bar out again whenever clients or window indices change. omp-tmux owns index 100
# of each hook, so a reload replaces these and leaves the rest of each hook alone.
# Client hooks carry the client's session in session_id, window hooks name theirs in hook_session.
set-hook -g 'client-attached[100]' 'run-shell -b "#{E:@omp_refresh}"'
set-hook -g 'client-detached[100]' 'run-shell -b "#{E:@omp_refresh}"'
set-hook -g 'client-resized[100]' 'run-shell -b "#{E:@omp_refresh}"'
# The session a client left is not exposed, so every session is laid out again.
set-hook -g 'client-session-changed[100]' 'run-shell -b "#{E:@omp_layout} refresh-all #{q:socket_path} >/dev/null 2>&1 || true"'
# tmux before 3.3 has no window hooks, so there the stale guard rebuilds after window changes.
%if '#{m/r:^(3[.]([3-9]|[1-9][0-9])|[4-9]|[1-9][0-9]|next|openbsd),#{version}}'
set-hook -g 'window-linked[100]' 'run-shell -b "#{E:@omp_layout} refresh #{q:socket_path} #{q:hook_session} >/dev/null 2>&1 || true"'
set-hook -g 'window-unlinked[100]' 'run-shell -b "#{E:@omp_layout} refresh #{q:socket_path} #{q:hook_session} >/dev/null 2>&1 || true"'
%endif

run-shell -b '#{E:@omp_layout} refresh-all #{q:socket_path} >/dev/null 2>&1 || true'
