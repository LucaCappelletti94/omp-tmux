# Mouse off: native terminal selection and link clicking beat clickable tabs.
set -g mouse off

set -g status-style 'bg=colour235,fg=colour250'
set -g status-interval 1

# Layout settings, left alone when set before this file is sourced.
set -goq @omp_max_rows 5
set -goq @omp_label_width 20

# OMP writes its state into the pane title over OSC 0: "π <sep> <label>".
# Separator: ">" idle, "!" needs input, braille spinner working.
set -g @omp_cell_omp '#{&&:#{m/r:^π . ,#{pane_title}},#{!=:#{s/^π . //:pane_title},}}'
# Hashes are escaped so a title is drawn as literal text, never as a style.
set -g @omp_cell_text '#{?#{E:@omp_cell_omp},#{s/^π . //;q/h:pane_title},#{q/h:window_name}}'
set -g @omp_cell_raw '#{?#{E:@omp_cell_omp},#{s/^π . //;s/[#]/x/:pane_title},#{s/[#]/x/:window_name}}'
set -g @omp_cell_width '#{w:#{E:@omp_cell_raw}}'
set -g @omp_cell_open '#{?window_active,#[bold underscore],}'
# Slots: "?" needs input, live spinner working, "·" idle, then "^" priority and "+" unseen bell.
set -g @omp_cell_state '#{?#{m:π ! *,#{pane_title}},#[fg=black bg=yellow]?#[fg=default bg=default],#{?#{m/r:^π [⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏] ,#{pane_title}},#[fg=colour250]#{=1:#{s/^π //:pane_title}}#[fg=default],#{?#{m/r:^π . ,#{pane_title}},#[fg=colour244]·#[fg=default], }}}'
set -g @omp_cell_flags '#{?#{==:#{@omp_priority},high},#[fg=white bg=colour129]^#[fg=default bg=default], }#{?window_bell_flag,#[fg=black bg=green]+#[fg=default bg=default], }'
set -g window-status-format '#{E:@omp_cell_open}#{E:@omp_cell_state}#{E:@omp_cell_flags}#{window_index}:#{?#{e|>:#{E:@omp_cell_width},#{@omp_label_width}},#{?#{e|>:#{@omp_label_width},1},#{=/#{e|-:#{@omp_label_width},1}/…:#{E:@omp_cell_text}},…},#{E:@omp_cell_text}}#[none]'
set -g window-status-current-format '#{E:window-status-format}'

# Whole-session counts, padded to the window count's digits so changes never shift the bar.
set -g @omp_n_waiting '#{n:#{W:#{?#{m:π ! *,#{pane_title}},x,}}}'
set -g @omp_n_bells '#{n:#{W:#{?window_bell_flag,x,}}}'
set -g @omp_n_priority '#{n:#{W:#{?#{==:#{@omp_priority},high},x,}}}'
set -g @omp_sum_waiting ' #{?#{e|>:#{E:@omp_n_waiting},0},#[fg=black bg=yellow],#[fg=colour244]}?#{E:@omp_n_waiting}#[fg=default bg=default]#{p/#{e|-:#{n:#{session_windows}},#{n:#{E:@omp_n_waiting}}}/:}'
set -g @omp_sum_bells ' #{?#{e|>:#{E:@omp_n_bells},0},#[fg=black bg=green],#[fg=colour244]}+#{E:@omp_n_bells}#[fg=default bg=default]#{p/#{e|-:#{n:#{session_windows}},#{n:#{E:@omp_n_bells}}}/:}'
set -g @omp_sum_priority ' #{?#{e|>:#{E:@omp_n_priority},0},#[fg=white bg=colour129],#[fg=colour244]}^#{E:@omp_n_priority}#[fg=default bg=default]#{p/#{e|-:#{n:#{session_windows}},#{n:#{E:@omp_n_priority}}}/:}'
set -g @omp_sum_total ' #{p/#{n:#{session_windows}}/:#{session_windows}} windows'
set -g @omp_sum_hints ' A w/d/p'
set -g @omp_sum_session ' [#{?#{e|>:#{w:#{s/[#]/x/:session_name}},12},#{=/11/…:#{q/h:session_name}},#{q/h:session_name}}]'
set -g @omp_sum_zoom ' #{?window_zoomed_flag,Z, }'

# One row with tmux's own overflow markers, shown while no current layout fits the client.
# The list draws nothing unless its opening style carries an alignment. The job refreshes
# the layout each second while this row shows, and tmux skips it whenever the grid is current.
set -g @omp_native_row '#[list=on align=left]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#{E:window-status-format} ,#[list=focus]#{E:window-status-format}#[list=on] }#[nolist align=right]#{E:@omp_sum_waiting}#{E:@omp_sum_bells}#{E:@omp_sum_priority}#(#{E:@omp_layout} refresh #{q:socket_path} #{q:session_id} >/dev/null 2>&1)'
set -g status on
set -g status-format[0] '#{E:@omp_native_row}'

# OMP rings the terminal bell on turn completion and ask prompts. Flag the
# window, show a brief message instead of ringing, ignore the active window.
set -g monitor-bell on
set -g visual-bell on
set -g bell-action other

# Mirror the active pane's OMP title on the outer terminal titlebar.
set -g set-titles on
set -g set-titles-string '#{pane_title}'

# Manual priority marking, agent pickers and layout refresh.
set -gF @omp_tmux_dir '#{d:current_file}'
set -g @omp_layout '#{q:@omp_tmux_dir}/scripts/omp-layout.sh'
bind-key A switch-client -T omp-agent
bind-key -T omp-agent h set-option -w @omp_priority high
bind-key -T omp-agent c set-option -wu @omp_priority
bind-key -T omp-agent p choose-tree -w -O index -f '#{==:#{@omp_priority},high}' -F '#{window_index}:#{window_name} [priority]'
bind-key -T omp-agent w choose-tree -w -O index -f '#{m:π ! *,#{pane_title}}' -F '#{window_index}: #{pane_title}'
bind-key -T omp-agent d choose-tree -w -O index -f '#{window_bell_flag}' -F '#{window_index}: #{pane_title}'
bind-key -T omp-agent r run-shell -b '#{E:@omp_layout} refresh #{q:socket_path} #{q:session_id}'

# Lay the bar out again whenever clients or window indices change. omp-tmux owns index 100
# of each hook, so a reload replaces these and leaves the rest of each hook alone.
# Client hooks carry the client's session in session_id, window hooks name theirs in hook_session.
set-hook -g 'client-attached[100]' 'run-shell -b "#{E:@omp_layout} refresh #{q:socket_path} #{q:session_id}"'
set-hook -g 'client-detached[100]' 'run-shell -b "#{E:@omp_layout} refresh #{q:socket_path} #{q:session_id}"'
set-hook -g 'client-resized[100]' 'run-shell -b "#{E:@omp_layout} refresh #{q:socket_path} #{q:session_id}"'
# The session a client left is not exposed, so every session is laid out again.
set-hook -g 'client-session-changed[100]' 'run-shell -b "#{E:@omp_layout} refresh-all #{q:socket_path}"'
set-hook -g 'window-linked[100]' 'run-shell -b "#{E:@omp_layout} refresh #{q:socket_path} #{q:hook_session}"'
set-hook -g 'window-unlinked[100]' 'run-shell -b "#{E:@omp_layout} refresh #{q:socket_path} #{q:hook_session}"'

run-shell '#{E:@omp_layout} refresh-all #{q:socket_path}'
