# Mouse off: native terminal selection and link clicking beat clickable tabs.
set -g mouse off

set -g status-style 'bg=colour235,fg=colour250'
set -g window-status-current-style 'bold,underscore'

# OMP writes its state into the pane title over OSC 0: "π <sep> <label>".
# Separator: ">" idle, "!" needs input, braille spinner working.
# Tabs derive a glyph and the bare label from that title. A bell flag marks
# "finished or asked while unattended" and clears itself on visit.
# Glyphs: "^" priority (manual), "?" needs input, live spinner working, "+" bell.
set -g window-status-format '#{?#{==:#{@omp_priority},high},#[fg=white]#[bg=colour129]#[bold]^,}#{?#{m:π ! *,#{pane_title}},#[fg=black]#[bg=yellow]#[bold]?,#{?#{m/r:^π [⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏] ,#{pane_title}},#[fg=colour250]#[bg=colour238]#{=1:#{s/^π //:pane_title}},#{?window_bell_flag,#[fg=black]#[bg=green]#[bold]+,}}} #I:#{?#{m:π *,#{pane_title}},#{=/20/…:#{s/^π . //:pane_title}},#W}#{?window_flags,#{window_flags}, }#[default]'
set -g window-status-current-format '#{?#{==:#{@omp_priority},high},#[fg=white]#[bg=colour129]#[bold]^,}#{?#{m:π ! *,#{pane_title}},#[fg=black]#[bg=yellow]#[bold]?,#{?#{m/r:^π [⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏] ,#{pane_title}},#[fg=colour250]#[bg=colour238]#{=1:#{s/^π //:pane_title}},#{?window_bell_flag,#[fg=black]#[bg=green]#[bold]+,}}} #I:#{?#{m:π *,#{pane_title}},#{=/20/…:#{s/^π . //:pane_title}},#W}#{?window_flags,#{window_flags}, }#[default]'

# OMP rings the terminal bell on turn completion and ask prompts. Flag the
# window, show a brief message instead of ringing, ignore the active window.
set -g monitor-bell on
set -g visual-bell on
set -g bell-action other

# Mirror the active pane's OMP title on the outer terminal titlebar.
set -g set-titles on
set -g set-titles-string '#{pane_title}'

# Manual priority marking and agent pickers.
bind-key A switch-client -T omp-agent
bind-key -T omp-agent h set-option -w @omp_priority high
bind-key -T omp-agent c set-option -wu @omp_priority
bind-key -T omp-agent p choose-tree -w -O index -f '#{==:#{@omp_priority},high}' -F '#{window_index}:#{window_name} [priority]'
bind-key -T omp-agent w choose-tree -w -O index -f '#{m:π ! *,#{pane_title}}' -F '#{window_index}: #{pane_title}'
bind-key -T omp-agent d choose-tree -w -O index -f '#{window_bell_flag}' -F '#{window_index}: #{pane_title}'
