name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so a new tmux release or a change on tmux master shows up before users hit it.
  schedule:
    - cron: '17 5 * * 1'
permissions:
  contents: read
# A newer push to a branch cancels its older run, while every run on main finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: tmux ${{ matrix.tmux }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # tmux master is a warning, never a failure of the change under test.
    continue-on-error: ${{ matrix.tmux == 'master' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, tmux: apt, locale: C.UTF-8 }
          - { os: ubuntu-24.04, tmux: apt, locale: C.UTF-8 }
          - { os: ubuntu-24.04, tmux: 3.3a, locale: C.UTF-8 }
          - { os: ubuntu-24.04, tmux: 3.5a, locale: C.UTF-8 }
          - { os: ubuntu-24.04, tmux: 3.6b, locale: C.UTF-8 }
          - { os: ubuntu-24.04, tmux: 3.7c, locale: C.UTF-8 }
          - { os: ubuntu-24.04, tmux: '3.8', locale: C.UTF-8 }
          - { os: ubuntu-24.04, tmux: master, locale: C.UTF-8 }
          - { os: macos-latest, tmux: brew, locale: en_US.UTF-8 }
    env:
      LANG: ${{ matrix.locale }}
      LC_ALL: ${{ matrix.locale }}
      TMUX_VERSION: ${{ matrix.tmux }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tmux and bats-core
        run: sh .github/ci-setup.sh
      - name: Run the layout and status grid tests
        run: bats tests/
      - name: Validate the remaining config options against a live server
        run: |
          set -eux
          tmux -L ci -f /dev/null new-session -d -x 200 -y 50
          trap 'tmux -L ci kill-server 2>/dev/null' EXIT
          tmux -L ci source-file ./omp-tmux.conf
          test "$(tmux -L ci show-options -gv monitor-bell)" = on
          test "$(tmux -L ci show-options -gv visual-bell)" = both
          test "$(tmux -L ci show-options -gv set-titles)" = on
  alpine:
    name: tmux on Alpine with BusyBox sh, awk and pkill
    runs-on: ubuntu-24.04
    container: alpine:3.24
    timeout-minutes: 15
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TMUX_VERSION: apk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tmux and bats-core
        run: sh .github/ci-setup.sh
      - name: Run the layout and status grid tests
        run: bats tests/
  awk:
    name: layout under ${{ matrix.awk }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        awk: [mawk, gawk --posix, original-awk, busybox awk]
    env:
      AWK: ${{ matrix.awk }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq bats mawk gawk original-awk busybox
      - name: Put this awk first on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/awk"
          printf '#!/bin/sh\nexec %s "$@"\n' "$AWK" >"$RUNNER_TEMP/awk/awk"
          chmod +x "$RUNNER_TEMP/awk/awk"
          echo "$RUNNER_TEMP/awk" >>"$GITHUB_PATH"
      - name: Run the layout tests, which need no tmux
        run: bats tests/layout.bats
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SHFMT: v3.14.1
      SHFMT_SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf
      ACTIONLINT: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned shfmt and actionlint
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo bin/shfmt "https://github.com/mvdan/sh/releases/download/$SHFMT/shfmt_${SHFMT}_linux_amd64"
          echo "$SHFMT_SHA256  bin/shfmt" | sha256sum -c -
          curl -fsSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT/actionlint_${ACTIONLINT}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz -C bin actionlint
          chmod +x bin/shfmt
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: ShellCheck
        run: shellcheck scripts/omp-layout.sh .github/ci-setup.sh tests/run.sh && shellcheck -s bash tests/*.bats tests/helpers.bash
      - name: shfmt
        run: shfmt -d scripts/omp-layout.sh .github/ci-setup.sh tests/run.sh tests/*.bats tests/helpers.bash
      - name: actionlint
        run: actionlint
